<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rawinnipa C4 Envelope — English</title>
    <style>
      @page { size: 324mm 229mm; margin: 0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 324mm; height: 229mm; background: transparent; }
      body { color: #0A0A0A; font-family: Inter, Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .artwork { position: relative; width: 324mm; height: 229mm; }
      .identity { position: absolute; top: 15mm; left: 16mm; display: flex; align-items: flex-start; gap: 4.5mm; }
      .logo { width: 15mm; height: 15mm; object-fit: contain; }
      .company { padding-top: 0.5mm; }
      .name { font-size: 10pt; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em; }
      .address { margin-top: 1.6mm; font-size: 7.5pt; font-weight: 400; line-height: 1.35; color: #2A2A2A; }
      .tagline { position: absolute; left: 16mm; bottom: 14mm; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.13em; }
      .dot { padding: 0 2.2mm; }
    </style>
  </head>
  <body>
    <main class="artwork">
      <section class="identity" aria-label="Rawinnipa sender identity">
        <img class="logo" src="../../02-logo/logo_black.png" alt="Rawinnipa">
        <div class="company">
          <div class="name">Rawinnipa Software and Consultants</div>
          <div class="address">Bangkok, Thailand <span class="dot">·</span> rawinsoft.com <span class="dot">·</span> sayhi@rawinsoft.com</div>
        </div>
      </section>
      <div class="tagline">BUILD<span class="dot">·</span>WHAT MOVES.</div>
    </main>
  </body>
</html>
